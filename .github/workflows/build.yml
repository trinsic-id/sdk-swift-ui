name: Build Swift

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Ensure all history and tags are fetched
      - name: Test macOS and portable contracts
        run: swift test
      - name: Test native Wallet on iOS
        run: scripts/test-ios.sh
